<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>XTOPUP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

.header{
background:linear-gradient(135deg,#111,#1a1a1a);
padding:30px;
text-align:center;
border-bottom:2px solid gold;
}

.logo{
font-size:35px;
font-weight:bold;
color:gold;
}

.tag{
color:#ccc;
margin-top:8px;
}

.container{
padding:15px;
}

.card{
background:#181818;
border:1px solid #2b2b2b;
border-radius:15px;
padding:15px;
margin-bottom:15px;
box-shadow:0 0 15px rgba(255,215,0,.15);
}

.title{
font-size:22px;
font-weight:bold;
color:gold;
margin-bottom:15px;
}

input,select{
width:100%;
padding:14px;
margin-top:10px;
background:#111;
border:1px solid #444;
border-radius:10px;
color:white;
}

.package{
display:flex;
justify-content:space-between;
padding:12px;
margin-top:10px;
background:#111;
border-radius:10px;
border:1px solid #333;
}

.price{
color:gold;
font-weight:bold;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:gold;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.footer{
text-align:center;
padding:20px;
color:#999;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">🖤 XTOPUP</div>
<div class="tag">Premium Gaming Top-Up Service</div>
</div>

<div class="container">

<div class="card">
<div class="title">🆔 Order Form</div>

<input type="text" id="uid" placeholder="Enter Free Fire UID">

<select id="package">
<option>25 Diamond - 25৳</option>
<option>50 Diamond - 46৳</option>
<option>100 Diamond - 82৳</option>
<option>240 Diamond - 182৳</option>
<option>505 Diamond - 389৳</option>
<option>850 Diamond - 645৳</option>
<option>Weekly Membership - 180৳</option>
<option>Monthly Membership - 850৳</option>
</select>

<button onclick="sendOrder()">
🚀 Order on WhatsApp
</button>
</div>

<div class="card">
<div class="title">💎 Popular Packages</div>

<div class="package">
<span>Weekly Membership</span>
<span class="price">180৳</span>
</div>

<div class="package">
<span>Monthly Membership</span>
<span class="price">850৳</span>
</div>

<div class="package">
<span>505 Diamond</span>
<span class="price">389৳</span>
</div>

<div class="package">
<span>850 Diamond</span>
<span class="price">645৳</span>
</div>

</div>

<div class="card">
<div class="title">💳 Payment Number</div>

<p>📱 bKash: 01325694336</p><br>
<p>📱 Nagad: 01325694336</p><br>
<p>📱 Rocket: 01325694336</p><br>
<p>📱 Upay: 01325694336</p>

</div>

</div>

<div class="footer">
© 2026 XTOPUP | Black Gold Edition
</div>

<script>
function sendOrder(){

let uid=document.getElementById("uid").value;
let pack=document.getElementById("package").value;

let msg=
`🔥 XTOPUP ORDER

UID: ${uid}

Package: ${pack}

Payment Number: 01325694336`;

window.open(
'https://wa.me/8801325694336?text='+
encodeURIComponent(msg)
);

}
</script>

</body>
</html>
